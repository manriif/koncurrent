name: Deploy Dokka to GitHub Pages

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Check that the tag is the version
        if: github.ref_type == 'tag'
        run: |
          ./gradlew -q properties --property version | grep -qx "version: $GITHUB_REF_NAME"
      - name: Generate API docs
        run: ./gradlew :dokkaGenerate
      - name: Point docs to this version
        run: |
          version=$(ls docs/api)
          echo "<meta http-equiv=\"refresh\" content=\"0; url=$version/\">" > docs/api/index.html
      - name: Deploy to the gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/api
          destination_dir: docs
          keep_files: true

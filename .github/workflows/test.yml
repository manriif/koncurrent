name: Run tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_windows:
        description: 'Run test-windows'
        required: false
        type: boolean
        default: true
      test_linux:
        description: 'Run test-linux'
        required: false
        type: boolean
        default: true
      test_macos:
        description: 'Run test-macos'
        required: false
        type: boolean
        default: true
  workflow_call:

permissions:
  contents: read

jobs:
  test-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.test_windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Run Windows native tests
        shell: bash
        run: ./gradlew mingwX64Test

  test-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.test_linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Run the JVM, Android, JS, Wasm and Linux native tests
        run: |
          ./gradlew jvmTest testAndroidHostTest jsNodeTest wasmJsNodeTest wasmWasiNodeTest \
            linuxX64Test

  test-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.test_macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Check the API of every target and run the Apple tests
        run: |
          ./gradlew checkKotlinAbi macosArm64Test iosSimulatorArm64Test \
            watchosSimulatorArm64Test tvosSimulatorArm64Test
